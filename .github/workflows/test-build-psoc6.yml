name: Wolfboot Reusable Build Workflow for Infineon PSoC 6

on:

  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      config-file:
        required: true
        type: string
      make-args:
        required: false
        type: string
      ramcode-check:
        required: false
        type: boolean
        default: false

jobs:

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-arm:v1.0
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch Infineon PSoC 6 libraries
        run: |
          tools/ci/fetch-psoc6-pdl.sh lib

      - name: make distclean
        run: |
          make distclean

      - name: Select config
        run: |
          cp ${{inputs.config-file}} .config && make include/target.h

      - name: Build tools
        run: |
          make -C tools/keytools && make -C tools/bin-assemble

      - name: Build wolfboot
        run: |
          make ${{inputs.make-args}} V=1

      - name: Check the self-update code is all in RAM
        if: ${{ inputs.ramcode-check }}
        run: |
          python3 tools/scripts/check-ramcode.py --selftest
          python3 tools/scripts/check-ramcode.py wolfboot.elf wolfBoot_self_update 0x08000000 0x08060000
