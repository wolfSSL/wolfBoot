name: Wolfboot Reusable Build Workflow (Renesas RX)

# Builds a Renesas RX example config with the GNU RX (GNURX) toolchain.
# GNURX is login-gated (no public URL), so it is provided via a prebuilt
# container image built from .github/docker/renesas-rx/ (as done for PowerPC).
# Refresh the image when bumping the toolchain version: see
# .github/docker/renesas-rx/README.md.

on:

  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      config-file:
        required: true
        type: string
      make-args:
        required: false
        type: string

jobs:

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-rx:v1.0
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: make clean
        run: |
          make distclean

      - name: Select config
        run: |
          cp ${{inputs.config-file}} .config

      - name: Build tools
        run: |
          make -C tools/keytools && make -C tools/bin-assemble

      - name: Build wolfboot and test-app
        # Build the default target: the bootloader plus the signed RX test-app
        # image. The app links via the ld-direct path (USE_GCC=0) using the
        # in-tree syscall/stdio stubs in test-app/syscalls.c (no newlib libc).
        run: |
          make USE_GCC=0 CROSS_COMPILE=rx-elf- ${{inputs.make-args}}

      - name: Check RX71M/RX24T ROMCODE word
        # ROMCODE (0xFFFFFF9C, 100 bytes before the end of wolfboot.bin) set to
        # 0x00000000 or 0x00000001 enables ROM code protection
        if: contains(inputs.config-file, 'rx71m') || contains(inputs.config-file, 'rx24t')
        run: |
          size=$(stat -c %s wolfboot.bin)
          romcode=$(od -An -tx1 -j $((size - 100)) -N 4 wolfboot.bin | tr -d ' \n')
          echo "ROMCODE: $romcode"
          test "$romcode" = "ffffffff"

      - name: Check RX24T ID code and MDE
        # ID code at 0xFFFFFFA0 (96 bytes before the end): without control
        # code 45h every programmer connection erases the flash.
        # MDE at 0xFFFFFF80 (128 bytes before the end) selects big endian.
        if: contains(inputs.config-file, 'rx24t')
        run: |
          case "${{inputs.make-args}}" in
            *BIG_ENDIAN=1*)
              want_id=450102030405060708090a0b0c0d0e0f
              want_mde=fffffff8 ;;
            *)
              want_id=03020145070605040b0a09080f0e0d0c
              want_mde=ffffffff ;;
          esac
          size=$(stat -c %s wolfboot.bin)
          id=$(od -An -tx1 -j $((size - 96)) -N 16 wolfboot.bin | tr -d ' \n')
          mde=$(od -An -tx1 -j $((size - 128)) -N 4 wolfboot.bin | tr -d ' \n')
          echo "ID code: $id"
          echo "MDE: $mde"
          test "$id" = "$want_id"
          test "$mde" = "$want_mde"
