name: Unit tests

on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-sim:v1.0
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: make clean
        run: |
          make keysclean && make -C tools/keytools clean && rm -f include/target.h

      - name: Fetch NXP MCUXpresso SDK headers
        run: |
          tools/ci/fetch-mcuxsdk-headers.sh "$GITHUB_WORKSPACE/mcuxsdk"

      - name: Fetch Infineon PSoC 6 PDL headers
        run: |
          tools/ci/fetch-psoc6-pdl.sh "$GITHUB_WORKSPACE/psoc6libs"

      - name: Build unit tests
        run: |
          make -C tools/unit-tests MCUXSDK="$GITHUB_WORKSPACE/mcuxsdk" \
            PSOC6_LIBS="$GITHUB_WORKSPACE/psoc6libs"

      - name: Run unit tests
        run: |
          make -C tools/unit-tests run MCUXSDK="$GITHUB_WORKSPACE/mcuxsdk" \
            PSOC6_LIBS="$GITHUB_WORKSPACE/psoc6libs"
